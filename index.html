<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PC28 巅峰大师精准稳赢版 v32</title>
<style>
:root{
  --bg: #f8fafc;
  --card: rgba(255, 255, 255, 0.88);
  --card-border: rgba(226, 232, 240, 0.9);
  --text: #0f172a;
  --text-2: #334155;
  --text-dim: #64748b;
  --accent: #2563eb;
  --green: #059669;
  --red: #dc2626;
  --yellow: #d97706;
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  padding:10px;
  background-color: var(--bg);
  background-image: 
    linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
  background-size: 24px 24px;
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 12px;
  line-height: 1.5;
  min-height: 100vh;
  padding-bottom: 30px;
  -webkit-font-smoothing: antialiased;
}
.card{
  background: var(--card);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  width: 100%;
  overflow: hidden;
}
h1{
  font-size: 15px; margin: 0 0 8px; color: var(--text); font-weight: 800;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
h1 .logo-dot{
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  box-shadow: 0 0 8px rgba(37,99,235,0.4);
}
h2{
  font-size: 12px; margin: 0 0 8px; color: var(--text);
  border-bottom: 1px solid rgba(0, 0, 0, 0.06); padding-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center; font-weight: 700;
}
h2 .h2-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2 .h2-title b{color:var(--accent);font-weight:800}
h2 .h2-title .meta-time{color:var(--text-dim);font-weight:400;font-size:10px;margin-left:4px}

.row{display:flex;justify-content:space-between;margin:5px 0;align-items:center}
.label{color:var(--text-dim);font-size:11px}
.value{font-weight:700;color:var(--text)}

/* 关键：绝对禁止左右滑动，强制宽度100% */
.table-container{
  width: 100%;
  overflow-x: hidden;
}
.history-table{
  width: 100%;
  table-layout: fixed;
  border-collapse: collapse;
  font-size: 9px;
}
.history-table th{
  padding: 8px 1px;
  text-align: center;
  color: var(--text-2);
  font-weight: 700;
  background: rgba(241, 245, 249, 0.95);
  border-bottom: 2px solid #e2e8f0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-table td{
  padding: 6px 1px;
  text-align: center;
  border-bottom: 1px solid #f1f5f9;
  color: var(--text);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.issue-cell{color:var(--text-dim);font-weight:600}
.time-cell{font-variant-numeric:tabular-nums;color:var(--text-2)}
.nums-cell{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.hit{color:var(--green);font-weight:700}
.miss{color:var(--red);font-weight:700}
.pending-row td{background:rgba(37,99,235,0.06)!important;font-weight:700}

.btn{
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff; border: none; border-radius: 8px;
  padding: 7px 14px; font-size: 11px; cursor: pointer; font-weight: 700;
  box-shadow: 0 3px 10px rgba(37,99,235,0.25);
}
.btn:active{transform:scale(0.97)}
.btn-copy{
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  padding: 4px 10px; font-size: 10px; border-radius: 6px;
  font-weight: 700; color:#fff; cursor:pointer; border:none;
}
.btn-scratch{
  background: linear-gradient(135deg, #06b6d4, #0891b2);
  padding: 4px 10px; font-size: 10px; border-radius: 6px; color: #fff;
  border: none; cursor: pointer; font-weight: 700;
}

.status{font-size:10px;color:var(--text-dim);margin-top:4px}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;animation:p 1.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(5,150,105,0.5)}50%{box-shadow:0 0 0 5px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}

.tab-bar{display:flex;gap:6px;margin-bottom:10px}
.tab{
  flex: 1; padding: 8px 4px; text-align: center;
  background: rgba(255, 255, 255, 0.6); border: 1px solid var(--card-border);
  border-radius: 10px; font-size: 11px; cursor: pointer; color: var(--text-2); font-weight: 700;
}
.tab.active{
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 10px rgba(37,99,235,0.3);
}
.tab-content{display:none}.tab-content.active{display:block}

.k-badge{
  display: inline-block; padding: 2px 8px; border-radius: 8px;
  background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.25);
  color: #7c3aed; font-weight: 800; font-size: 10px;
}

.summary{
  background: rgba(241, 245, 249, 0.7); border: 1px solid var(--card-border);
  border-radius: 10px; padding: 8px; margin-top: 8px; display: flex;
  justify-content: space-around; text-align: center; flex-wrap: wrap; gap: 4px;
}
.summary .sv{font-size:15px;font-weight:800;color:var(--text)}
.summary .sl{font-size:9px;color:var(--text-dim);margin-top:1px;font-weight:600}

.cd-box{
  background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(124,58,237,0.06));
  border: 1px solid rgba(37,99,235,0.15); border-radius: 12px;
  padding: 10px; margin-top: 6px; text-align: center;
}
.cd-label{font-size:10px;color:var(--text-2);margin-bottom:2px;font-weight:600}
.cd-time{font-size:28px;font-weight:900;color:#2563eb;letter-spacing:1px;line-height:1.1}
.cd-time.urgent{color:#dc2626;animation:p .8s infinite}
.cd-sub{font-size:9px;color:var(--text-dim);margin-top:4px}
.progress-wrap{margin-top:8px;background:rgba(0,0,0,0.06);border-radius:6px;height:6px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#059669);transition:width .3s linear;border-radius:6px}
.progress-bar.urgent{background:linear-gradient(90deg,#dc2626,#ef4444)}
.progress-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);margin-top:3px}

.pred-card-box{
  background: rgba(241, 245, 249, 0.7);
  border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; margin-top: 6px;
}
.pred-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(0,0,0,0.08);white-space:nowrap}
.pred-row:last-child{border-bottom:none}
.pred-title{font-weight:800;color:var(--text-2);font-size:11px}
.pred-content{font-weight:900;font-size:11px;white-space:nowrap}
.val-high{color:#059669;background:rgba(5,150,105,0.1);padding:2px 6px;border-radius:6px;border:1px solid rgba(5,150,105,0.2)}
.val-low{color:#d97706;background:rgba(217,119,6,0.1);padding:2px 6px;border-radius:6px;border:1px solid rgba(217,119,6,0.2)}
.val-main{color:#2563eb}
.val-def{color:#d97706}

.scratch-wrap{
  position: relative; margin-top: 6px; border-radius: 14px; overflow: hidden;
  background: rgba(241, 245, 249, 0.7); border: 1px solid var(--card-border); min-height: 95px;
}
.scratch-under{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 4px}
.num-row{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:nowrap;width:100%}
.num-box{width:38px;height:38px;background:#ffffff;color:var(--text);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;border:1px solid #cbd5e1;flex-shrink:0}
.op{font-size:14px;font-weight:800;color:var(--text-dim);padding:0 2px;flex-shrink:0}
.sum-box{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(135deg,#2563eb,#1d4ed8);flex-shrink:0}
.sep{width:0;height:26px;border-left:2px dotted #cbd5e1;margin:0 6px;flex-shrink:0}
.size-box{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0}
.size-big{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.size-small{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.parity-odd{background:linear-gradient(135deg,#2563eb,#1d4ed8)}
.parity-even{background:linear-gradient(135deg,#dc2626,#b91c1c)}
#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;display:none;border-radius:14px}
#scratchCanvas.active{display:block}

.trend-wrap{max-height:480px;overflow-y:auto;border-radius:10px;background:rgba(255,255,255,0.5);border:1px solid var(--card-border)}
.trend-table{width:100%;border-collapse:collapse;font-size:10px;white-space:nowrap}
.trend-table th{position:sticky;top:0;background:rgba(241,245,249,0.95);color:var(--text-2);padding:6px 1px;font-weight:700;z-index:2}
.trend-table td{padding:4px 1px;text-align:center;border-bottom:1px solid #f1f5f9;height:24px;vertical-align:middle;white-space:nowrap}
.trend-table tr.latest td{background:rgba(37,99,235,0.08)}
.trend-table .issue{color:var(--text-dim);font-size:9px;font-weight:600}
.trend-table .val{font-weight:800;color:var(--text)}
.tag{display:inline-block;padding:1px 4px;border-radius:4px;font-size:9px;font-weight:800}
.tag-big{background:rgba(220,38,38,0.12);color:#dc2626}
.tag-small{background:rgba(37,99,235,0.12);color:#2563eb}
.tag-odd{background:rgba(37,99,235,0.12);color:#2563eb}
.tag-even{background:rgba(220,38,38,0.12);color:#dc2626}

.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:10px;padding:6px;background:rgba(241,245,249,0.7);border:1px solid var(--card-border);border-radius:8px}
.pager-btn{background:#ffffff;border:1px solid #cbd5e1;color:var(--text);border-radius:6px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer}
.pager-btn:disabled{opacity:0.3;cursor:not-allowed}
.pager-info{font-size:11px;font-weight:700;color:var(--text)}
.pager-info .cur{color:var(--accent);font-weight:900}
</style>
</head>
<body>

<div class="card">
  <h1><span class="logo-dot"></span>PC28 巅峰大师精准稳赢版 <span class="k-badge">v32-HMS</span></h1>
  <div class="row"><span class="label">运行状态</span><span class="value"><span class="pulse"></span><span id="statusText">零观望实时全开</span></span></div>
  <div class="row"><span class="label">最新期号</span><span class="value" id="latestIssue">-</span></div>

  <div class="cd-box">
    <div class="cd-label">下期开奖倒计时</div>
    <div class="cd-time" id="countdown">--:--</div>

    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="progress-labels"><span id="cdStart">--:--</span><span id="cdEnd">--:--</span></div>
  </div>

</div>

<div class="card">
  <h2>

        <div class="num-box" id="lrB">?</div><div class="op">+</div>

</div>

<div class="card">
  <h2>
    <span class="h2-title" style="color:#2563eb;font-weight:800">🎯 本期顶尖高精度大师预测</span>
    <button class="btn btn-copy" id="copyBtn" onclick="copyPrediction()">📋 复制全部</button>
  </h2>
  <div class="pred-card-box">
    <div class="pred-row">
      <span class="pred-title">组合预测：</span>
      <span class="pred-content"><span class="val-main" id="predMain">-</span> | <span class="val-def" id="predDef">-</span></span>
    </div>

      <span class="pred-title">🔥 高置信度 (2和值)：</span>

      <span class="pred-content val-low" id="predLowSum">-</span>
    </div>
  </div>
</div>

<div class="tab-bar">
  <div class="tab active" data-tab="trend" onclick="switchTab('trend')">走势图</div>
  <div class="tab" data-tab="history" onclick="switchTab('history')">预测记录表</div>
</div>

<div class="tab-content active" id="tab-trend">
  <div class="card">
    <h2>最近 100 期走势矩阵</h2>
    <div class="trend-wrap">
      <table class="trend-table">
        <thead>
          <tr>
            <th>期号</th><th>值</th><th>大</th><th>小</th><th>单</th><th>双</th>
            <th>大单</th><th>大双</th><th>小单</th><th>小双</th>
          </tr>
        </thead>
        <tbody id="trendBody"></tbody>
      </table>
    </div>
    <div class="summary" id="trendSummary"></div>
  </div>
</div>

<div class="tab-content" id="tab-history">
  <div class="card">
    <h2>🎯 完整预测记录与下期预测表 (每页25期·时间精确到时分秒)</h2>
    <div class="summary" id="summaryBox"></div>
    <div class="table-container" style="margin-top:8px;">
      <table id="historyTable" class="history-table">
        <thead>
          <tr>
            <th style="width:13%;">期号</th>
            <th style="width:14%;">开奖时间(时分秒)</th>
            <th style="width:15%;">开奖号码</th>
            <th style="width:22%;">组合预测(主|防)</th>
            <th style="width:20%;">和值预测(高|低)</th>
            <th style="width:16%;">判定结果</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pager" id="historyPager">
      <button class="pager-btn" id="prevPageBtn" onclick="historyPrevPage()">‹ 上一页</button>
      <div class="pager-info"><span class="cur" id="pagerCur">1</span> / <span id="pagerTotal">1</span></div>
      <button class="pager-btn" id="nextPageBtn" onclick="historyNextPage()">下一页 ›</button>
    </div>
  </div>
</div>

<script>
const APIS = [
  { url: 'https://yu28.top/api/kj?nbr=100', headers: { 'X-Api-Key': 'yu28_6e21b2467d66f604' } },
  { url: 'https://pc28.help/api/kj.json?nbr=100', headers: {} },
];
const WINDOW_SIZE = 45;
const POLL_INTERVAL = 60000;
const DEFAULT_PERIOD_MS = 210 * 1000;
const TREND_MAX = 100;
const HISTORY_REBUILD_COUNT = 50;
const HISTORY_PER_PAGE = 25; // 严格每页25期

const THEORY_SUM_WEIGHTS = {
  0:1, 1:3, 2:6, 3:10, 4:15, 5:21, 6:28, 7:36, 8:45, 9:55,
  10:63, 11:69, 12:72, 13:73, 14:73, 15:72, 16:69, 17:63, 18:55, 19:45,
  20:36, 21:28, 22:21, 23:15, 24:10, 25:6, 26:3, 27:1
};

function parseDrawTime(dateStr,timeStr){
  if(!dateStr||!timeStr)return NaN;
  const[y,m,d]=dateStr.split('-').map(Number);
  const[hh,mm,ss]=timeStr.split(':').map(Number);
  return Date.UTC(y,m-1,d,hh,mm,ss)-8*3600*1000;
}
function formatDateTime(drawTime){
  if(!drawTime)return '';
  const m=drawTime.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2}:\d{2})/);
  if(!m)return drawTime;
  return `${m[1]}/${parseInt(m[2],10)}/${parseInt(m[3],10)} ${m[4]}`;
}

const DB_NAME='pc28_v32_light',DB_VER=1;let db=null;
function openDB(){return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,DB_VER);
  req.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('draws')){const s=d.createObjectStore('draws',{keyPath:'issue'});s.createIndex('draw_time','draw_time');}
    if(!d.objectStoreNames.contains('preds'))d.createObjectStore('preds',{keyPath:'key'});
  };
  req.onsuccess=e=>{db=e.target.result;resolve(db);};
  req.onerror=e=>reject(e.target.error);
});}
function dbGetAll(s){return new Promise((res,rej)=>{const r=db.transaction(s,'readonly').objectStore(s).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function dbPut(s,o){return new Promise((res,rej)=>{const r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbPutMany(s,arr){return new Promise((res,rej)=>{const tx=db.transaction(s,'readwrite');const st=tx.objectStore(s);arr.forEach(o=>st.put(o));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

let state={
  lastIssue:'',cycleCount:0,lastHistory:[],
  periodMs:DEFAULT_PERIOD_MS,nextDrawTs:0,lastDrawTs:0,
  pendingTick:false,currentPred:null,
  scratchActive:false,latestDraw:null,historyRebuilt:false,
  historyPage:0,
};

async function fetchDraws(){
  let lastErr=null;
  for(const api of APIS){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),12000);
      const res=await fetch(api.url,{signal:ctrl.signal,cache:'no-store',headers:api.headers});
      clearTimeout(timer);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      if(json.message!=='success'||!Array.isArray(json.data))throw new Error('格式异常');
      return json.data.map(item=>{
        let nums,sum,combo,dateStr,timeStr,ts;
        if(item.number&&item.number.includes('+')&&!item.number.includes('=')){
          nums=item.number.split('+').map(Number);
          sum=item.num!=null?item.num:nums.reduce((a,b)=>a+b,0);
          combo=item.combination;dateStr=item.date;timeStr=item.time;
          ts=parseDrawTime(dateStr,timeStr);
        }else if(item.number&&item.number.includes('=')){
          const m=item.number.match(/(\d+)\+(\d+)\+(\d+)=(\d+)/);
          if(!m)throw new Error('number 格式异常');
          nums=[Number(m[1]),Number(m[2]),Number(m[3])];sum=Number(m[4]);
          combo=item.combination;
          const parts=(item.time||'').split(' ');
          dateStr=parts[0];timeStr=parts[1];
          ts=parseDrawTime(dateStr,timeStr);
        }else throw new Error('未知 number 格式');
        const size=sum>=14?'大':'小';
        const parity=sum%2===1?'单':'双';
        return{
          issue:String(item.nbr),draw_time:`${dateStr} ${timeStr}`,
          date:dateStr,time:timeStr,ts,
          num_a:nums[0],num_b:nums[1],num_c:nums[2],
          sum_val:sum,size,parity,combo:combo||(size+parity),
        };
      });
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('所有接口都失败');
}

function detectPeriod(draws){
  if(draws.length<3)return DEFAULT_PERIOD_MS;
  const sorted=draws.slice().sort((a,b)=>a.ts-b.ts);
  const gaps=[];
  const maxN=Math.min(sorted.length,15);
  for(let i=1;i<maxN;i++){const gap=sorted[i].ts-sorted[i-1].ts;if(gap>30000&&gap<3600*1000)gaps.push(gap);}
  if(!gaps.length)return DEFAULT_PERIOD_MS;
  gaps.sort((a,b)=>a-b);
  return gaps[Math.floor(gaps.length/2)];
}

function updateNextDrawTs(latest){if(!latest||!latest.ts)return;state.lastDrawTs=latest.ts;state.nextDrawTs=latest.ts+state.periodMs;}
function formatCd(ms){if(ms<=0)return'00:00';const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function formatClock(ts){const dt=new Date(ts+8*3600*1000);return String(dt.getUTCHours()).padStart(2,'0')+':'+String(dt.getUTCMinutes()).padStart(2,'0')+':'+String(dt.getUTCSeconds()).padStart(2,'0');}
function renderCountdown(){
  const el=document.getElementById('countdown'),sub=document.getElementById('cdSub');
  const bar=document.getElementById('progressBar');
  const startEl=document.getElementById('cdStart'),endEl=document.getElementById('cdEnd');
  if(!state.nextDrawTs){el.textContent='--:--';sub.textContent='等待数据...';bar.style.width='0%';return;}
  const total=state.periodMs;
  const remain=state.nextDrawTs-Date.now();
  const elapsed=total-Math.max(0,remain);
  const pct=Math.max(0,Math.min(100,(elapsed/total)*100));
  el.textContent=formatCd(remain);
  bar.style.width=pct.toFixed(1)+'%';
  startEl.textContent=formatClock(state.lastDrawTs);
  endEl.textContent=formatClock(state.nextDrawTs);
  if(remain<=0){el.className='cd-time urgent';bar.className='progress-bar urgent';sub.textContent='⚠️ 已过预计时间...';if(!state.pendingTick){state.pendingTick=true;tick().finally(()=>{state.pendingTick=false;});}}
  else if(remain<=30000){el.className='cd-time urgent';bar.className='progress-bar urgent';sub.textContent=`约 ${Math.ceil(remain/1000)} 秒后开奖`;}
  else{el.className='cd-time';bar.className='progress-bar';sub.textContent=`预计 ${formatClock(state.nextDrawTs)} 开奖`;}
}
function startCountdownLoop(){setInterval(renderCountdown,200);}

function runMasterAlgorithm(seq, sumSeq) {
    const M = sumSeq ? sumSeq.length : 0;
    const sumScores = {};
    for (let s = 0; s <= 27; s++) {
        sumScores[s] = (THEORY_SUM_WEIGHTS[s] / 73.0) * 2.0;
    }

    if (M > 0) {
        for (let i = 0; i < M; i++) {
            const sVal = sumSeq[i];
            const weight = Math.pow(0.92, M - 1 - i);
            sumScores[sVal] += weight * 4.0;
        }
        const lastSum = sumSeq[M - 1];
        for (let d = -2; d <= 2; d++) {
            const targetS = lastSum + d;
            if (targetS >= 0 && targetS <= 27) {
                sumScores[targetS] += (3 - Math.abs(d)) * 1.5;
            }
        }
        for (let s = 0; s <= 27; s++) {
            let lastIdx = -1;
            for (let i = M - 1; i >= 0; i--) {
                if (sumSeq[i] === s) { lastIdx = i; break; }
            }
            const omission = lastIdx === -1 ? M : (M - 1 - lastIdx);
            if (omission >= 7) {
                sumScores[s] += Math.min(omission * 0.4, 4.5);
            }
        }
    }

    const rankedSums = [];
    for (let s = 0; s <= 27; s++) rankedSums.push({ sum: s, score: sumScores[s] });
    rankedSums.sort((a, b) => b.score - a.score);

    const highSum = [rankedSums[0].sum, rankedSums[1].sum];
    const lowSum = [rankedSums[2].sum, rankedSums[3].sum, rankedSums[4].sum];

    const comboScores = { '大双': 0, '大单': 0, '小双': 0, '小单': 0 };
    rankedSums.forEach(item => {
        const s = item.sum;
        const size = s >= 14 ? '大' : '小';
        const parity = s % 2 === 1 ? '单' : '双';
        comboScores[size + parity] += item.score;
    });

    const rankedCombos = Object.keys(comboScores).sort((a, b) => comboScores[b] - comboScores[a]);
    const main = [rankedCombos[0], rankedCombos[1]];
    const defense = rankedCombos[2];

    return { main, defense, highSum, lowSum };
}

async function rebuildHistoryFromDraws(){
  const allDraws = await dbGetAll('draws');
  const MIN_WINDOW = 10;
  const n = allDraws.length;
  if (n < MIN_WINDOW + 1) return 0;

  const asc = allDraws.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const existing = await dbGetAll('preds');
  const existingKeys = new Set(existing.map(p => p.key));

  const maxRebuild = Math.min(HISTORY_REBUILD_COUNT, n - MIN_WINDOW);
  const startK = n - maxRebuild;

  const newPreds = [];
  for (let k = startK; k < n; k++) {
    const predIssue = asc[k - 1].issue;
    if (existingKeys.has(predIssue)) continue;

    const windowStart = Math.max(0, k - WINDOW_SIZE);
    const windowDraws = asc.slice(windowStart, k);
    if (windowDraws.length < MIN_WINDOW) continue;

    const seq = windowDraws.map(d => d.combo);
    const sumSeq = windowDraws.map(d => d.sum_val);
    const pred = runMasterAlgorithm(seq, sumSeq);
    if (!pred) continue;

    const actualDraw = asc[k];
    const actualCombo = actualDraw.combo;
    const actualSum = actualDraw.sum_val;

    const mainHit = pred.main.includes(actualCombo) ? 1 : 0;
    const defHit = (mainHit === 0 && pred.defense === actualCombo) ? 1 : 0;
    const sumHit = pred.highSum.includes(actualSum) || pred.lowSum.includes(actualSum) ? 1 : 0;

    newPreds.push({
      key: predIssue, issue: predIssue,
      predict_time: asc[k - 1].draw_time,
      main: pred.main, defense: pred.defense,
      highSum: pred.highSum, lowSum: pred.lowSum,
      actual: actualCombo, actualSum: actualSum,
      main_hit: mainHit, def_hit: defHit, sum_hit: sumHit,
      historical: true,
    });
  }
  if (newPreds.length) await dbPutMany('preds', newPreds);
  return newPreds.length;
}

async function drawTrend(){
  const tbody = document.getElementById('trendBody');
  const allDraws = await dbGetAll('draws');
  if (!allDraws.length) { tbody.innerHTML = '<tr><td colspan="10">暂无数据...</td></tr>'; return; }
  const draws = allDraws.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0)).slice(-TREND_MAX).reverse();
  const html = draws.map((d, i) => {
    const isLatest = i === 0;
    if (isLatest && state.scratchActive) {
      return `<tr class="latest">
        <td class="issue">${d.issue}</td>
        <td colspan="9" style="color:var(--text-dim);font-style:italic">? ? ? 刮开查看</td>
      </tr>`;
    }
    const isBig = d.sum_val >= 14;
    const isOdd = d.sum_val % 2 === 1;
    const combo = d.combo || ((isBig ? '大' : '小') + (isOdd ? '单' : '双'));
    return `<tr class="${isLatest ? 'latest' : ''}">
      <td class="issue">${d.issue}</td>
      <td class="val">${String(d.sum_val).padStart(2, '0')}</td>
      <td>${isBig ? '<span class="tag tag-big">大</span>' : ''}</td>
      <td>${!isBig ? '<span class="tag tag-small">小</span>' : ''}</td>
      <td>${isOdd ? '<span class="tag tag-odd">单</span>' : ''}</td>
      <td>${!isOdd ? '<span class="tag tag-even">双</span>' : ''}</td>
      <td>${combo === '大单' ? '<span class="tag tag-small">大单</span>' : ''}</td>
      <td>${combo === '大双' ? '<span class="tag tag-big">大双</span>' : ''}</td>
      <td>${combo === '小单' ? '<span class="tag tag-small">小单</span>' : ''}</td>
      <td>${combo === '小双' ? '<span class="tag tag-big">小双</span>' : ''}</td>
    </tr>`;
  }).join('');
  tbody.innerHTML = html;

  const visible = state.scratchActive ? draws.slice(1) : draws;
  const counts = {'大单':0,'大双':0,'小单':0,'小双':0};
  visible.forEach(d => { if (counts[d.combo] != null) counts[d.combo]++; });
  const total = visible.length || 1;
  document.getElementById('trendSummary').innerHTML = `
    <div><div class="sv" style="color:#dc2626">${counts['大单']}</div><div class="sl">大单</div></div>
    <div><div class="sv" style="color:#d97706">${counts['大双']}</div><div class="sl">大双</div></div>
    <div><div class="sv" style="color:#2563eb">${counts['小单']}</div><div class="sl">小单</div></div>
    <div><div class="sv" style="color:#0891b2">${counts['小双']}</div><div class="sl">小双</div></div>
    <div><div class="sv">${(visible.filter(d=>d.sum_val>=14).length*100/total).toFixed(0)}%</div><div class="sl">大占比</div></div>
    <div><div class="sv">${(visible.filter(d=>d.sum_val%2===1).length*100/total).toFixed(0)}%</div><div class="sl">单占比</div></div>
  `;
}

function initScratch(){
  const canvas = document.getElementById('scratchCanvas');
  const wrap = document.getElementById('scratchWrap');
  canvas.classList.add('active');
  const dpr = window.devicePixelRatio || 1;
  const w = wrap.offsetWidth, h = wrap.offsetHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#334155'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('👆 手指滑动刮开查看最新开奖', w / 2, h / 2 + 5);
  state.scratchActive = true;
  updateScratchBtn();
  drawTrend();
  let drawing = false;
  const erase = (x, y) => {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
    checkReveal();
  };
  const getPos = e => {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };
  canvas.onmousedown = canvas.ontouchstart = e => { e.preventDefault(); drawing = true; const {x,y} = getPos(e); erase(x,y); };
  canvas.onmousemove = canvas.ontouchmove = e => { if (!drawing) return; e.preventDefault(); const {x,y} = getPos(e); erase(x,y); };
  canvas.onmouseup = canvas.ontouchend = canvas.onmouseleave = () => { drawing = false; };
}
function checkReveal(){
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  try {
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let transparent = 0, total = 0;
    for (let i = 3; i < img.length; i += 16) { total++; if (img[i] < 100) transparent++; }
    if (transparent / total > 0.6 && state.scratchActive) revealAll();
  } catch (e) {}
}
function revealAll(){
  const canvas = document.getElementById('scratchCanvas');
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.classList.remove('active');
  if (state.scratchActive) { state.scratchActive = false; updateScratchBtn(); drawTrend(); }
}
function toggleScratch(){ if (state.scratchActive) revealAll(); else initScratch(); }
function updateScratchBtn(){ document.getElementById('scratchBtn').textContent = state.scratchActive ? '👁 揭晓' : '🎯 刮奖'; }

function getNextIssue(){
  const latest = state.latestDraw;
  if(!latest || !latest.issue) return '?';
  const n = parseInt(latest.issue, 10);
  return isNaN(n) ? latest.issue : String(n + 1);
}

function copyPrediction(){
  if (!state.currentPred) return;
  const p = state.currentPred;
  const nextIssue = getNextIssue();
  const text = `${nextIssue}期预测|主攻:${p.main.join('·')} 防守:${p.defense}|高置信和值:${p.highSum.join(',')}|低置信和值:${p.lowSum.join(',')}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      const orig = btn.textContent;
      btn.textContent = '✅ 已复制';
      setTimeout(() => btn.textContent = orig, 1500);
    });
  }
}

async function tick(){
  try {
    setStatus('同步数据...', 'warn');
    const draws = await fetchDraws();
    if (!draws.length) return;

    await dbPutMany('draws', draws);
    state.periodMs = detectPeriod(draws);

    const latest = draws[0];
    state.latestDraw = latest;
    setLatest(latest);
    updateNextDrawTs(latest);

    if (!state.historyRebuilt) {
      state.historyRebuilt = true;
      await rebuildHistoryFromDraws();
    }

    await drawTrend();

    if (latest.issue === state.lastIssue) { setStatus(`实时同步中(${latest.issue})`, 'ok'); return; }
    state.lastIssue = latest.issue;
    state.cycleCount++;

    const all = await dbGetAll('draws');
    all.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const pred = runMasterAlgorithm(all.map(d => d.combo), all.map(d => d.sum_val));
    if (!pred) return;
    state.currentPred = pred;
    renderPrediction(pred);

    await dbPut('preds', {
      key: latest.issue, issue: latest.issue,
      predict_time: latest.draw_time,
      main: pred.main, defense: pred.defense,
      highSum: pred.highSum, lowSum: pred.lowSum,
      actual: null, actualSum: null,
      main_hit: null, def_hit: null, sum_hit: null, historical: false,
    });

    await backfill(all, draws);
    await refreshHistory();
    setStatus(`引擎运行中 (第${state.cycleCount}轮)`, 'ok');
  } catch (e) {
    setStatus('错误：' + e.message, 'bad');
  }
}

async function backfill(allDraws, draws){
  const allPreds = await dbGetAll('preds');
  const predMap = {}; allPreds.forEach(p => predMap[p.issue] = p);
  const asc = allDraws.slice().sort((a, b) => a.ts - b.ts);
  const nextMap = {};
  for (let i = 0; i < asc.length - 1; i++) nextMap[asc[i].issue] = asc[i + 1];

  for (const [issue, p] of Object.entries(predMap)) {
    if (p.actual) continue;
    const nxt = nextMap[issue];
    if (!nxt) continue;
    p.actual = nxt.combo;
    p.actualSum = nxt.sum_val;
    p.main_hit = p.main.includes(nxt.combo) ? 1 : 0;
    p.def_hit = (p.main_hit === 0 && p.defense === nxt.combo) ? 1 : 0;
    p.sum_hit = (p.highSum && p.highSum.includes(nxt.sum_val)) || (p.lowSum && p.lowSum.includes(nxt.sum_val)) ? 1 : 0;
    await dbPut('preds', p);
  }
}

async function refreshHistory(){
  const preds = await dbGetAll('preds');
  const allDraws = await dbGetAll('draws');
  const ascDraws = allDraws.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const issueToNext = {};
  for (let i = 0; i < ascDraws.length - 1; i++) issueToNext[ascDraws[i].issue] = ascDraws[i + 1];

  const filled = preds.filter(p => p.actual)
    .sort((a, b) => (b.issue || '').localeCompare(a.issue || ''));

  state.lastHistory = filled;
  const total = filled.length;
  const mainHits = filled.filter(p => p.main_hit).length;
  const defHits = filled.filter(p => p.def_hit).length;
  const sumHits = filled.filter(p => p.sum_hit).length;
  const empty = total - mainHits - defHits;

  document.getElementById('summaryBox').innerHTML = `
    <div><div class="sv">${total}</div><div class="sl">总期</div></div>
    <div><div class="sv" style="color:#059669">${mainHits}</div><div class="sl">主攻中</div></div>
    <div><div class="sv" style="color:#d97706">${defHits}</div><div class="sl">防守中</div></div>
    <div><div class="sv" style="color:#2563eb">${sumHits}</div><div class="sl">和值中</div></div>
    <div><div class="sv" style="color:#dc2626">${empty}</div><div class="sl">全空</div></div>
    <div><div class="sv">${total ? (mainHits * 100 / total).toFixed(1) : 0}%</div><div class="sl">主攻率</div></div>
  `;

  renderHistoryPage(filled, issueToNext);
}

function renderHistoryPage(filled, issueToNext){
  const total = filled.length;
  const totalPages = Math.max(1, Math.ceil(total / HISTORY_PER_PAGE));
  if (state.historyPage >= totalPages) state.historyPage = totalPages - 1;
  if (state.historyPage < 0) state.historyPage = 0;

  const startIdx = state.historyPage * HISTORY_PER_PAGE;
  const pageItems = filled.slice(startIdx, startIdx + HISTORY_PER_PAGE);

  const tbody = document.querySelector('#historyTable tbody');
  tbody.innerHTML = '';

  // 第一行实时插入下一期的完整预测
  if (state.historyPage === 0 && state.currentPred) {
    const nextIssue = getNextIssue();
    const p = state.currentPred;
    const pendingTr = document.createElement('tr');
    pendingTr.className = 'pending-row';
    pendingTr.innerHTML = `
      <td class="issue-cell">${nextIssue}期(预)</td>
      <td class="time-cell">即将开奖</td>
      <td>等待开奖</td>
      <td><span style="color:#2563eb">${p.main.join('·')}</span><span style="color:var(--text-dim);font-size:8px">(${p.defense})</span></td>
      <td><span style="color:#059669">[${p.highSum.join(',')}]</span><span style="color:#d97706;font-size:8px">[${p.lowSum.join(',')}]</span></td>
      <td><span style="color:#2563eb">等待...</span></td>
    `;
    tbody.appendChild(pendingTr);
  }

  if (!pageItems.length && !state.currentPred) {
    tbody.innerHTML = '<tr><td colspan="6">暂无记录</td></tr>';
  } else {
    for (const p of pageItems) {
      const tr = document.createElement('tr');
      let mark = p.main_hit ? '<span class="hit">主攻🀄</span>' : (p.def_hit ? '<span class="hit">防守🀄</span>' : '<span class="miss">全空🌸</span>');
      if (p.sum_hit) mark += '<span style="color:#2563eb;font-size:8px">和🀄</span>';

      const nextDraw = issueToNext[p.issue];
      let issueShow = p.issue, timeShow = '', numsShow = '?', combo = '-';
      if (nextDraw) {
        issueShow = nextDraw.issue;
        // 提取精确到时分秒的时间 (HH:MM:SS)
        const m = (nextDraw.draw_time || '').match(/(\d{2}:\d{2}:\d{2})/);
        timeShow = m ? m[1] : (nextDraw.draw_time || '').slice(-8);
        numsShow = `${nextDraw.num_a}+${nextDraw.num_b}+${nextDraw.num_c}=${nextDraw.sum_val}`;
        combo = nextDraw.combo;
      }

      const mainStr = Array.isArray(p.main) ? p.main.join('·') : '';
      const defStr = p.defense ? `(${p.defense})` : '';
      const highStr = p.highSum ? p.highSum.join(',') : '';
      const lowStr = p.lowSum ? p.lowSum.join(',') : '';

      // 完美呈现：精确到时分秒的时间、完整组合、和值预测
      tr.innerHTML = `
        <td class="issue-cell">${issueShow}</td>
        <td class="time-cell">${timeShow}</td>
        <td class="nums-cell">${numsShow}</td>
        <td><span style="color:#2563eb">${mainStr}</span><span style="color:var(--text-dim);font-size:8px">${defStr}</span></td>
        <td><span style="color:#059669">[${highStr}]</span><span style="color:#d97706;font-size:8px">[${lowStr}]</span></td>
        <td>${mark}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  document.getElementById('pagerCur').textContent = state.historyPage + 1;
  document.getElementById('pagerTotal').textContent = totalPages;
  document.getElementById('prevPageBtn').disabled = (state.historyPage <= 0);
  document.getElementById('nextPageBtn').disabled = (state.historyPage >= totalPages - 1);
}
function historyPrevPage(){ if (state.historyPage > 0) { state.historyPage--; refreshHistory(); } }
function historyNextPage(){
  const totalPages = Math.ceil(state.lastHistory.length / HISTORY_PER_PAGE);
  if (state.historyPage < totalPages - 1) { state.historyPage++; refreshHistory(); }
}

function setStatus(msg, type){
  const el = document.getElementById('statusText');
  el.textContent = msg;
  el.className = type === 'ok' ? 'hit' : type === 'bad' ? 'miss' : 'warn';
}
function setLatest(d){
  document.getElementById('latestIssue').textContent = d.issue;
  document.getElementById('latestHeader').innerHTML = `<b>第${d.issue}期</b><span class="meta-time">${formatDateTime(d.draw_time)}</span>`;
  document.getElementById('lrA').textContent = d.num_a;
  document.getElementById('lrB').textContent = d.num_b;
  document.getElementById('lrC').textContent = d.num_c;
  document.getElementById('lrSum').textContent = d.sum_val;
  const isBig = d.sum_val >= 14;
  document.getElementById('lrSize').textContent = isBig ? '大' : '小';
  document.getElementById('lrSize').className = 'size-box ' + (isBig ? 'size-big' : 'size-small');
  const isOdd = d.sum_val % 2 === 1;
  document.getElementById('lrParity').textContent = isOdd ? '单' : '双';
  document.getElementById('lrParity').className = 'size-box ' + (isOdd ? 'parity-odd' : 'parity-even');
}

function renderPrediction(pred){
  const nextIssue = getNextIssue();
  document.getElementById('predMain').textContent = `${nextIssue}期主攻: ${pred.main.join(' · ')}`;
  document.getElementById('predDef').textContent = `防守: ${pred.defense}`;
  document.getElementById('predHighSum').textContent = pred.highSum.join(' , ');
  document.getElementById('predLowSum').textContent = pred.lowSum.join(' , ');
  refreshHistory();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  if (name === 'trend') setTimeout(drawTrend, 50);
}

async function boot(){
  await openDB();
  updateScratchBtn();
  await refreshHistory();
  await tick();
  startCountdownLoop();
  setInterval(tick, POLL_INTERVAL);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });
  window.addEventListener('resize', () => { drawTrend(); if (state.scratchActive) initScratch(); });
}
boot();
</script>
