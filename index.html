<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PC28 v6 严格度量预测</title>
<style>
:root{
  --bg:#f2f4f8;
  --bg-2:#e9edf4;
  --card:#ffffff;
  --card-2:#f8fafc;
  --border:#e3e8f0;
  --border-strong:#d0d8e4;
  --text:#1c2333;
  --text-2:#4a5568;
  --text-dim:#8b96a8;
  --text-faint:#a8b1c1;
  --accent:#3b82f6;
  --accent-2:#8b5cf6;
  --green:#10b981;
  --green-bg:#d1fae5;
  --red:#ef4444;
  --red-bg:#fee2e2;
  --yellow:#f59e0b;
  --yellow-bg:#fef3c7;
  --purple:#8b5cf6;
  --purple-bg:#ede9fe;
  --blue:#3b82f6;
  --blue-bg:#dbeafe;
  --shadow-sm:0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md:0 4px 12px rgba(15,23,42,0.08), 0 2px 4px rgba(15,23,42,0.04);
  --shadow-lg:0 10px 30px rgba(15,23,42,0.10), 0 4px 8px rgba(15,23,42,0.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  padding:10px;
  background:linear-gradient(180deg, #f7f9fc 0%, #eef2f8 100%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px;line-height:1.55;
  min-height:100vh;padding-bottom:24px;
  -webkit-font-smoothing:antialiased;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:var(--shadow-md);
}

h1{
  font-size:16px;margin:0 0 8px;
  color:var(--text);
  font-weight:800;letter-spacing:0.3px;
  display:flex;align-items:center;gap:6px;
}
h1 .logo-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg, #3b82f6, #8b5cf6);
  box-shadow:0 0 8px rgba(59,130,246,0.5);
}
h2{
  font-size:13px;margin:0 0 10px;
  color:var(--text);
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-weight:700;
}
h2 .h2-title{flex:1;font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2 .h2-title b{color:var(--accent);font-weight:800}
h2 .h2-title .meta-time{color:var(--text-dim);font-weight:400;font-size:11px;margin-left:4px}

.row{display:flex;justify-content:space-between;margin:5px 0;align-items:center}
.label{color:var(--text-dim);font-size:12px;font-weight:500}
.value{font-weight:700;color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:4px 2px;text-align:center;border-bottom:1px solid var(--border)}
th{color:var(--text-dim);font-weight:600}
.num{text-align:right;font-variant-numeric:tabular-nums}
.hit{color:var(--green)}.miss{color:var(--red)}.empty{color:var(--text-dim)}

.btn{
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  color:#fff;border:none;border-radius:10px;
  padding:9px 18px;font-size:13px;cursor:pointer;margin:2px;
  font-weight:700;
  box-shadow:0 2px 8px rgba(59,130,246,0.35);
  transition:all .15s;
}
.btn:active{transform:scale(0.97);box-shadow:0 1px 4px rgba(59,130,246,0.5)}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:8px}
.btn-outline{
  background:#fff;
  border:1.5px solid var(--border-strong);
  color:var(--text-2);
  box-shadow:var(--shadow-sm);
}
.btn-outline:active{background:var(--card-2)}
.btn-green{
  background:linear-gradient(135deg, #10b981, #059669);
  box-shadow:0 2px 8px rgba(16,185,129,0.35);
}
.btn-copy{
  background:linear-gradient(135deg, #8b5cf6, #7c3aed);
  padding:5px 14px;font-size:11px;border-radius:8px;
  box-shadow:0 2px 8px rgba(139,92,246,0.35);
  font-weight:700;
}
.btn-copy:active{transform:scale(0.96)}
.btn-scratch{
  background:linear-gradient(135deg, #06b6d4, #0891b2);
  padding:5px 14px;font-size:11px;border-radius:8px;
  color:#fff;border:none;cursor:pointer;flex-shrink:0;
  font-weight:700;
  box-shadow:0 2px 8px rgba(6,182,212,0.35);
}
.btn-scratch:active{transform:scale(0.96)}

.status{font-size:11px;color:var(--text-dim);margin-top:6px}
.pulse{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-right:6px;
  box-shadow:0 0 0 0 rgba(16,185,129,0.6);
  animation:p 1.8s infinite;
}
@keyframes p{
  0%{box-shadow:0 0 0 0 rgba(16,185,129,0.6)}
  50%{box-shadow:0 0 0 6px rgba(16,185,129,0)}
  100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}
}
@keyframes copied{0%{transform:scale(1)}30%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.tab-bar{display:flex;gap:6px;margin-bottom:10px}
.tab{
  flex:1;padding:9px 6px;text-align:center;
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:12px;font-size:12px;cursor:pointer;
  color:var(--text-2);font-weight:700;
  transition:all .2s;
  box-shadow:var(--shadow-sm);
}
.tab.active{
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(59,130,246,0.4);
}
.tab-content{display:none}.tab-content.active{display:block;animation:fadeIn .25s ease}

.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px}
.metric-box{
  background:linear-gradient(135deg, #f0f5ff 0%, #ede9fe 100%);
  border:1px solid #e0e7ff;
  border-radius:12px;padding:8px;
  text-align:center;
  box-shadow:var(--shadow-sm);
}
.metric-box .mv{
  font-size:17px;font-weight:800;
  color:#4f46e5;
}
.metric-box .ml{font-size:10px;color:var(--text-dim);margin-top:2px;font-weight:600}

.k-badge{
  display:inline-block;padding:3px 10px;border-radius:10px;
  background:linear-gradient(135deg, #ede9fe, #dbeafe);
  border:1px solid #c7d2fe;
  color:#6d28d9;font-weight:800;font-size:11px;
}
.warn{color:var(--yellow)}

.summary{
  background:linear-gradient(135deg, #f8fafc, #f0f5ff);
  border:1px solid var(--border);
  border-radius:12px;padding:10px;margin-top:10px;
  display:flex;justify-content:space-around;text-align:center;flex-wrap:wrap;gap:8px;
}
.summary .sv{font-size:17px;font-weight:800;color:var(--text)}
.summary .sl{font-size:10px;color:var(--text-dim);margin-top:1px;font-weight:600}

.cd-box{
  background:linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%);
  border:1px solid #e0e7ff;
  border-radius:14px;padding:12px;margin-top:8px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);
}
.cd-label{font-size:11px;color:var(--text-dim);margin-bottom:4px;letter-spacing:0.5px;font-weight:600}
.cd-time{
  font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;
  color:#4f46e5;
  letter-spacing:2px;line-height:1.1;
  text-shadow:0 2px 8px rgba(79,70,229,0.15);
}
.cd-time.urgent{
  color:#ef4444;
  text-shadow:0 2px 8px rgba(239,68,68,0.2);
  animation:p .8s infinite;
}
.cd-time.soon{
  color:#f59e0b;
  text-shadow:0 2px 8px rgba(245,158,11,0.2);
}
.cd-sub{font-size:10px;color:var(--text-dim);margin-top:6px;font-weight:500}

.notify-badge{
  display:inline-block;padding:4px 12px;border-radius:10px;
  font-size:11px;font-weight:700;
  background:#f1f5f9;color:var(--text-dim);
  border:1px solid var(--border-strong);
}
.notify-badge.on{
  background:var(--green-bg);color:#059669;
  border-color:#6ee7b7;
}
.notify-badge.off{
  background:var(--red-bg);color:#dc2626;
  border-color:#fca5a5;
}

.progress-wrap{
  margin-top:10px;background:#e9edf4;
  border-radius:10px;height:10px;overflow:hidden;
  border:1px solid var(--border);
  position:relative;
  box-shadow:inset 0 1px 2px rgba(15,23,42,0.06);
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg, #3b82f6, #10b981);
  transition:width .3s linear;
  border-radius:10px;
  box-shadow:0 0 8px rgba(59,130,246,0.5);
}
.progress-bar.soon{
  background:linear-gradient(90deg, #f59e0b, #fb923c);
  box-shadow:0 0 8px rgba(245,158,11,0.5);
}
.progress-bar.urgent{
  background:linear-gradient(90deg, #ef4444, #dc2626);
  box-shadow:0 0 8px rgba(239,68,68,0.6);
  animation:p .8s infinite;
}
.progress-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-faint);margin-top:4px;font-weight:600}

/* ============ 预测单行 ============ */
.pred-line{
  display:flex;justify-content:center;align-items:baseline;gap:20px;
  padding:16px 6px;font-weight:800;
  font-size:clamp(15px,4.6vw,20px);
  letter-spacing:0.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pred-line .item{display:inline-flex;align-items:baseline}
.pred-line .lbl{font-weight:600;color:var(--text-dim);font-size:.8em;margin-right:4px}
.pred-line .main-val{color:#059669}
.pred-line .def-val{color:#d97706}

/* ============ 最新一期开奖 ============ */
.scratch-wrap{
  position:relative;margin-top:8px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
  border:1px solid var(--border);
  min-height:110px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
}
.scratch-under{
  position:absolute;inset:0;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:14px 6px;
}
.num-row{
  display:flex;align-items:center;justify-content:center;
  gap:4px;flex-wrap:nowrap;width:100%;
}

.num-box{
  width:46px;height:46px;
  background:#fff;
  color:#1c2333;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;
  border:1.5px solid var(--border);
  box-shadow:
    0 2px 6px rgba(15,23,42,0.06),
    inset 0 -2px 0 rgba(15,23,42,0.04);
  flex-shrink:0;
  font-family:-apple-system,"PingFang SC",sans-serif;
}
.op{font-size:16px;font-weight:800;color:var(--text-faint);padding:0 2px;flex-shrink:0}

.sum-box{
  width:50px;height:50px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:#fff;
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  box-shadow:
    0 4px 12px rgba(59,130,246,0.4),
    inset 0 -2px 0 rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.25);
  flex-shrink:0;
  font-family:-apple-system,"PingFang SC",sans-serif;
}
.sep{
  width:0;height:32px;
  border-left:2px dotted #cbd5e1;
  margin:0 8px;flex-shrink:0;
}
.size-box{
  width:46px;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:900;color:#fff;
  box-shadow:
    0 4px 12px rgba(15,23,42,0.15),
    inset 0 -2px 0 rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.25);
  flex-shrink:0;
  font-family:-apple-system,"PingFang SC",sans-serif;
}
.size-big{
  background:linear-gradient(135deg, #ef4444, #dc2626);
  box-shadow:0 4px 12px rgba(239,68,68,0.4), inset 0 -2px 0 rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
}
.size-small{
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  box-shadow:0 4px 12px rgba(59,130,246,0.4), inset 0 -2px 0 rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
}
.parity-odd{
  background:linear-gradient(135deg, #3b82f6, #2563eb);
  box-shadow:0 4px 12px rgba(59,130,246,0.4), inset 0 -2px 0 rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
}
.parity-even{
  background:linear-gradient(135deg, #ef4444, #dc2626);
  box-shadow:0 4px 12px rgba(239,68,68,0.4), inset 0 -2px 0 rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.25);
}

#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;display:none;border-radius:16px}
#scratchCanvas.active{display:block}

/* ============ 走势图 ============ */
.trend-wrap{
  max-height:520px;overflow-y:auto;border-radius:12px;
  background:#fff;
  border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
}
.trend-table{width:100%;border-collapse:collapse;font-size:11px}
.trend-table th{
  position:sticky;top:0;
  background:#f8fafc;
  color:var(--text-dim);padding:8px 1px;font-weight:700;
  z-index:2;font-size:10px;border-bottom:1.5px solid var(--border);
}
.trend-table td{
  padding:4px 1px;text-align:center;
  border-bottom:1px solid #f1f5f9;
  height:24px;vertical-align:middle;
}
.trend-table tr.latest td{background:#eff6ff}
.trend-table tr.latest .issue{color:var(--accent);font-weight:800}
.trend-table tr.hidden td{color:var(--text-faint) !important;font-style:italic}
.trend-table tr.hidden .tag{display:none}
.trend-table tr.hidden .hidden-q{display:inline-block;color:var(--text-faint);font-weight:800;font-size:14px;letter-spacing:1px}
.trend-table .issue{color:var(--text-dim);font-size:10px;font-weight:600}
.trend-table .val{font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.trend-table .tag{
  display:inline-block;padding:1px 6px;border-radius:5px;
  font-size:10px;min-width:18px;line-height:16px;font-weight:800;
}
.tag-big{background:var(--red-bg);color:#b91c1c}
.tag-small{background:var(--blue-bg);color:#1d4ed8}
.tag-odd{background:var(--blue-bg);color:#1d4ed8}
.tag-even{background:var(--red-bg);color:#b91c1c}
.tag-combo-big{background:var(--red-bg);color:#b91c1c}
.tag-combo-small{background:var(--blue-bg);color:#1d4ed8}
.trend-empty{padding:24px;text-align:center;color:var(--text-dim);font-size:12px}
.hidden-q{display:none}

/* ============ 对错明细 ============ */
.history-table{font-size:11px}
.history-table th{padding:7px 1px;font-size:10px;color:var(--text-dim);font-weight:700}
.history-table td{padding:5px 1px;font-size:10px}
.history-table .issue-cell{font-size:10px;color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:600}
.history-table .time-cell{font-size:10px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.history-table .nums-cell{font-size:10px;font-variant-numeric:tabular-nums;font-weight:800;color:var(--text)}
.history-table .pattern-cell{text-align:center}
.pattern-tag{
  display:inline-block;padding:2px 6px;border-radius:5px;
  font-size:9px;font-weight:800;
}
.pt-baozi{background:var(--purple-bg);color:#6d28d9}
.pt-shunzi{background:#cffafe;color:#0e7490}
.pt-duizi{background:var(--yellow-bg);color:#b45309}
.pt-zaliu{background:#f1f5f9;color:#64748b}

/* ============ 形态统计 ============ */
.pattern-stats{
  background:linear-gradient(135deg, #f8fafc, #f0f5ff);
  border:1px solid var(--border);
  border-radius:12px;padding:12px;margin-top:10px;
  display:flex;justify-content:space-around;text-align:center;
  flex-wrap:wrap;gap:8px;
  box-shadow:var(--shadow-sm);
}
.pattern-stat-item{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px}
.pattern-stat-val{font-size:18px;font-weight:900;color:var(--text)}
.pattern-stat-lbl{font-size:9px;font-weight:800}

/* 滚动条美化 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
</style>
</head>
<body>

<div class="card">
  <h1><span class="logo-dot"></span>PC28 v6 <span class="k-badge" id="kDisplay">k=1.00</span></h1>
  <div class="row">
    <span class="label">状态</span>
    <span class="value"><span class="pulse"></span><span id="statusText">初始化</span></span>
  </div>
  <div class="row">
    <span class="label">最新期号</span>
    <span class="value" id="latestIssue">-</span>
  </div>

  <div class="cd-box">
    <div class="cd-label">下期开奖倒计时</div>
    <div class="cd-time" id="countdown">--:--</div>
    <div class="cd-sub" id="cdSub">等待数据...</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="progress-labels"><span id="cdStart">--:--</span><span id="cdEnd">--:--</span></div>
  </div>

  <div class="row" style="margin-top:10px">
    <span class="label">通知</span>
    <span class="value">
      <span class="notify-badge" id="notifyBadge">未授权</span>
      <button class="btn btn-sm btn-green" id="notifyBtn" onclick="enableNotify()">开启</button>
    </span>
  </div>
  <div style="text-align:center;margin-top:8px">
    <button class="btn btn-sm btn-outline" onclick="testNotify()">测试通知</button>
  </div>
  <div class="status" id="statusMsg"></div>
</div>

<div class="card">
  <h2>
    <span class="h2-title" id="latestHeader">等待数据...</span>
    <button class="btn-scratch" id="scratchBtn" onclick="toggleScratch()">🎯 刮奖</button>
  </h2>
  <div class="scratch-wrap" id="scratchWrap">
    <div class="scratch-under">
      <div class="num-row">
        <div class="num-box" id="lrA">?</div>
        <div class="op">+</div>
        <div class="num-box" id="lrB">?</div>
        <div class="op">+</div>
        <div class="num-box" id="lrC">?</div>
        <div class="op">=</div>
        <div class="sum-box" id="lrSum">?</div>
        <div class="sep"></div>
        <div class="size-box size-small" id="lrSize">?</div>
        <div class="size-box parity-odd" id="lrParity">?</div>
      </div>
    </div>
    <canvas id="scratchCanvas"></canvas>
  </div>
</div>

<div class="card">
  <h2>
    <span class="h2-title" style="color:#4f46e5;font-weight:800">本期预测</span>
    <button class="btn btn-copy" id="copyBtn" onclick="copyPrediction()">📋 复制</button>
  </h2>
  <div class="pred-line" id="predLine">
    <span class="item"><span class="lbl">主攻：</span><span class="main-val">-</span></span>
    <span class="item"><span class="lbl">防守：</span><span class="def-val">-</span></span>
  </div>
  <div style="text-align:center;margin-top:2px;font-size:11px;color:var(--text-dim)" id="fixationMsg"></div>
</div>

<div class="tab-bar">
  <div class="tab active" data-tab="trend" onclick="switchTab('trend')">走势图</div>
  <div class="tab" data-tab="metrics" onclick="switchTab('metrics')">指标明细</div>
  <div class="tab" data-tab="history" onclick="switchTab('history')">对错记录</div>
</div>

<div class="tab-content active" id="tab-trend">
  <div class="card">
    <h2>最近 100 期走势</h2>
    <div class="trend-wrap">
      <table class="trend-table">
        <thead>
          <tr>
            <th>期号</th><th>值</th><th>大</th><th>小</th><th>单</th><th>双</th>
            <th>大单</th><th>大双</th><th>小单</th><th>小双</th>
          </tr>
        </thead>
        <tbody id="trendBody"></tbody>
      </table>
    </div>
    <div class="summary" id="trendSummary"></div>
  </div>
</div>

<div class="tab-content" id="tab-metrics">

function parseDrawTime(dateStr,timeStr){
  if(!dateStr||!timeStr)return NaN;
  const[y,m,d]=dateStr.split('-').map(Number);
  const[hh,mm,ss]=timeStr.split(':').map(Number);
  return Date.UTC(y,m-1,d,hh,mm,ss)-8*3600*1000;
}
function formatDateTime(drawTime){
  if(!drawTime)return '';
  const m=drawTime.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}:\d{2}:\d{2})/);
  if(!m)return drawTime;
  return `${m[1]}/${parseInt(m[2],10)}/${parseInt(m[3],10)} ${m[4]}`;
}

  const s=[a,b,c].sort((x,y)=>x-y);
  if(s[1]===s[0]+1 && s[2]===s[1]+1) return '顺子';

}

function detectPeriod(draws){
  if(draws.length<3)return DEFAULT_PERIOD_MS;
  const sorted=draws.slice().sort((a,b)=>a.ts-b.ts);
  const gaps=[];
  const maxN=Math.min(sorted.length,15);
  for(let i=1;i<maxN;i++){const gap=sorted[i].ts-sorted[i-1].ts;if(gap>30000&&gap<3600*1000)gaps.push(gap);}
  if(!gaps.length)return DEFAULT_PERIOD_MS;
  gaps.sort((a,b)=>a-b);
  return gaps[Math.floor(gaps.length/2)];
}

/* ================================================================
   v6 算法
   ================================================================ */
function expWeightedFreq(seq,halfLife){
  const N=seq.length;if(N===0)return Object.fromEntries(COMBOS.map(c=>[c,0]));
  const lam=Math.log(2)/halfLife;let wsum=0;const weights=[];
  for(let i=0;i<N;i++){const w=Math.exp(-lam*(N-1-i));weights.push(w);wsum+=w;}
  wsum=wsum||1;const freq={};
  for(const c of COMBOS){let s=0;for(let i=0;i<N;i++)if(seq[i]===c)s+=weights[i];freq[c]=s/wsum;}
  return freq;
}
function getStreak(seq,combo){if(!seq.length||seq[seq.length-1]!==combo)return 0;let s=1;for(let i=seq.length-2;i>=0;i--){if(seq[i]===combo)s++;else break;}return s;}
function getMiss(seq,combo){const N=seq.length;for(let i=N-1;i>=0;i--)if(seq[i]===combo)return N-1-i;return N;}
function transitionProb(seq,prevCombo,target){
  if(!prevCombo)return 0.25;let total=0,match=0;
  for(let i=1;i<seq.length;i++){if(seq[i-1]===prevCombo){total++;if(seq[i]===target)match++;}}
  return total===0?0.25:match/total;
}
function computeMetrics(seq,k){
  const N=seq.length;if(N===0)return null;
  const prevCombo=N>=2?seq[N-2]:null;
  const counts={};for(const c of COMBOS)counts[c]=0;
  for(const c of seq)counts[c]++;
  const half=Math.floor(N/2);
  const front=seq.slice(0,half),back=seq.slice(half);
  const frontN=Math.max(front.length,1),backN=Math.max(back.length,1);
  const frontFreq={},backFreq={};
  for(const c of COMBOS){frontFreq[c]=front.filter(x=>x===c).length/frontN;backFreq[c]=back.filter(x=>x===c).length/backN;}
  const H=expWeightedFreq(seq,15);
  const Hvals=COMBOS.map(c=>H[c]);
  const Hmax=Math.max(...Hvals),Hmin=Math.min(...Hvals),Hrange=Hmax-Hmin;
  const avgCnt=N/4;const metrics={};
  for(const c of COMBOS){
    const streak=getStreak(seq,c);
    const P1=100*(1-Math.exp(-k*streak/2));
    const miss=getMiss(seq,c);
    const P2=100*(1-Math.exp(-k*miss/10));
    const cnt=counts[c];
    const P3=Math.min(100,100*Math.abs(cnt-avgCnt)/avgCnt);
    const tp=transitionProb(seq,prevCombo,c);
    const P4=100*tp;
    const delta=backFreq[c]-frontFreq[c];
    const P5=50+50*Math.tanh(k*delta*5);
    const post=(cnt+2*0.25)/(N+2);
    const P6=100*Math.abs(post-0.25)/0.75;
    const P7=Hrange>1e-9?100*(H[c]-Hmin)/Hrange:50;
    metrics[c]=[+P1.toFixed(2),+P2.toFixed(2),+P3.toFixed(2),+P4.toFixed(2),+P5.toFixed(2),+P6.toFixed(2),+P7.toFixed(2)];
  }
  return metrics;
}
function strictSort(metrics){
  return[...COMBOS].sort((a,b)=>{const ma=metrics[a],mb=metrics[b];for(let i=0;i<7;i++)if(mb[i]!==ma[i])return mb[i]-ma[i];return 0;});
}
function predict(seq,k,applyFixation){
  const metrics=computeMetrics(seq,k);if(!metrics)return null;
  let ranked=strictSort(metrics);let fixationTriggered=false;
  if(applyFixation){
    const top1=ranked[0];const h=state.top1History;
    if(h.length>=STICKY_PERIOD&&h.slice(-STICKY_PERIOD).every(x=>x===top1)){ranked=ranked.slice(1).concat([top1]);fixationTriggered=true;}
    state.top1History.push(top1);if(state.top1History.length>20)state.top1History.shift();
  }
  return{main:ranked.slice(0,2),defense:ranked[2],ranked,metrics,k,fixationTriggered};
}
function backtestBestK(seqAll){
  const n=seqAll.length;if(n<60)return{k:state.k};
  const start=Math.max(40,n-100);
  const kValues=[];for(let k=K_MIN;k<=K_MAX+1e-9;k+=K_STEP)kValues.push(+k.toFixed(2));
  let bestK=state.k,bestScore=-1;
  for(const k of kValues){
    let mainHits=0,defHits=0,total=0;
    for(let i=start;i<n;i++){
      const w=seqAll.slice(Math.max(0,i-40),i);if(w.length<20)continue;
      const m=computeMetrics(w,k);if(!m)continue;
      const ranked=strictSort(m);const main=ranked.slice(0,2),defense=ranked[2],actual=seqAll[i];
      total++;if(main.includes(actual))mainHits++;else if(actual===defense)defHits++;
    }
    if(total===0)continue;
    const score=(mainHits*0.7+defHits*0.3)/total;
    if(score>bestScore){bestScore=score;bestK=k;}
  }
  return{k:bestK};
}

/* ================================================================
   历史重建
   ================================================================ */
async function rebuildHistoryFromDraws(){
  const allDraws=await dbGetAll('draws');
  if(allDraws.length<80)return 0;
  const asc=allDraws.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const n=asc.length;
  const existing=await dbGetAll('preds');
  const existingKeys=new Set(existing.map(p=>p.key));
  const startK=n-HISTORY_REBUILD_COUNT;
  if(startK<WINDOW_SIZE)return 0;

  const newPreds=[];
  for(let k=startK;k<n;k++){
    const predIssue=asc[k-1].issue;
    if(existingKeys.has(predIssue))continue;
    const windowDraws=asc.slice(Math.max(0,k-WINDOW_SIZE),k);
    if(windowDraws.length<20)continue;
    const seq=windowDraws.map(d=>d.combo);
    const pred=predict(seq,state.k,false);
    if(!pred)continue;
    const actual=asc[k].combo;
    const mainHit=pred.main.includes(actual)?1:0;
    const defHit=(mainHit===0&&pred.defense===actual)?1:0;
    newPreds.push({
      key:predIssue,issue:predIssue,
      predict_time:asc[k-1].draw_time,
      main:pred.main,defense:pred.defense,
      ranked:pred.ranked,metrics:pred.metrics,k:state.k,
      actual:actual,main_hit:mainHit,def_hit:defHit,
      historical:true,
    });
  }
  if(newPreds.length)await dbPutMany('preds',newPreds);
  console.log(`[历史重建] 新增 ${newPreds.length} 条`);
  return newPreds.length;
}

      <td>${combo==='小单'?`<span class="tag ${comboCls}">小单</span>`:''}</td>

  }).join('');

  const visibleDraws=state.scratchActive?draws.slice(1):draws;
  const counts={'大单':0,'大双':0,'小单':0,'小双':0};
  visibleDraws.forEach(d=>{if(counts[d.combo]!=null)counts[d.combo]++;});
  const total=visibleDraws.length||1;
  const bigCount=visibleDraws.filter(d=>d.sum_val>=14).length;
  const oddCount=visibleDraws.filter(d=>d.sum_val%2===1).length;
  document.getElementById('trendSummary').innerHTML=`
    <div><div class="sv" style="color:#dc2626">${counts['大单']}</div><div class="sl">大单</div></div>
    <div><div class="sv" style="color:#dc2626">${counts['大双']}</div><div class="sl">大双</div></div>
    <div><div class="sv" style="color:#2563eb">${counts['小单']}</div><div class="sl">小单</div></div>
    <div><div class="sv" style="color:#2563eb">${counts['小双']}</div><div class="sl">小双</div></div>
    <div><div class="sv">${(bigCount*100/total).toFixed(0)}%</div><div class="sl">大占比</div></div>
    <div><div class="sv">${(oddCount*100/total).toFixed(0)}%</div><div class="sl">单占比</div></div>

function initScratch(){
  const canvas=document.getElementById('scratchCanvas');
  const wrap=document.getElementById('scratchWrap');
  canvas.classList.add('active');
  const dpr=window.devicePixelRatio||1;
  const w=wrap.offsetWidth,h=wrap.offsetHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);

  const grad=ctx.createLinearGradient(0,0,w,h);
  grad.addColorStop(0,'#cbd5e1');
  grad.addColorStop(0.5,'#94a3b8');
  grad.addColorStop(1,'#cbd5e1');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  ctx.fillText('👆 手指滑动刮开',w/2,h/2-4);
  ctx.font='11px sans-serif';
  ctx.fillText('揭晓最新一期开奖',w/2,h/2+14);

  state.scratchActive=true;
  updateScratchBtn();
  drawTrend();

  let drawing=false;
  const erase=(x,y)=>{
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill();
    checkReveal();
  };
  const getPos=e=>{
    const rect=canvas.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    return{x:p.clientX-rect.left,y:p.clientY-rect.top};
  };
  canvas.onmousedown=canvas.ontouchstart=e=>{e.preventDefault();drawing=true;const{x,y}=getPos(e);erase(x,y);};
  canvas.onmousemove=canvas.ontouchmove=e=>{if(!drawing)return;e.preventDefault();const{x,y}=getPos(e);erase(x,y);};
  canvas.onmouseup=canvas.ontouchend=canvas.onmouseleave=canvas.ontouchcancel=()=>{drawing=false;};
}
function checkReveal(){
  const canvas=document.getElementById('scratchCanvas');
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  try{
    const img=ctx.getImageData(0,0,w,h).data;
    let transparent=0,total=0;
    for(let i=3;i<img.length;i+=16){total++;if(img[i]<100)transparent++;}
    if(transparent/total>0.6&&state.scratchActive){revealAll();}
  }catch(e){}
}
function revealAll(){
  const canvas=document.getElementById('scratchCanvas');
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas.classList.remove('active');
  if(state.scratchActive){
    state.scratchActive=false;
    updateScratchBtn();
    drawTrend();
  }
}
function toggleScratch(){
  if(state.scratchActive){revealAll();}else{initScratch();}
}
function updateScratchBtn(){
  const btn=document.getElementById('scratchBtn');
  btn.textContent=state.scratchActive?'👁 揭晓':'🎯 刮奖';
}

/* ================================================================
   复制
   ================================================================ */
function copyPrediction(){
  if(!state.currentPred){setStatus('暂无预测可复制','warn');return;}
  const main=state.currentPred.main.join('·');
  const def=state.currentPred.defense||'无';
  const text=`主攻：${main} | 防守：${def}`;
  const onSuccess=()=>{
    const btn=document.getElementById('copyBtn');
    const orig=btn.textContent;
    btn.textContent='✅ 已复制';
    btn.style.animation='copied .4s';
    setStatus('已复制：'+text,'ok');
    setTimeout(()=>{btn.textContent=orig;btn.style.animation='';},1500);
  };
  const onFail=(e)=>{setStatus('复制失败，请长按选择','warn');console.warn(e);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(onSuccess).catch(()=>{fallbackCopy(text)?onSuccess():onFail('fallback failed');});
  }else{fallbackCopy(text)?onSuccess():onFail('no clipboard');}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
  ta.setAttribute('readonly','');
  document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);return ok;
}

/* ================================================================
   主循环
   ================================================================ */
async function tick(){
  try{
    setStatus('拉取数据...','warn');
    const draws=await fetchDraws();
    if(!draws.length){setStatus('接口无数据','warn');return;}

    await dbPutMany('draws',draws);
    state.periodMs=detectPeriod(draws);

    const latest=draws[0];
    state.latestDraw=latest;
    setLatest(latest);
    updateNextDrawTs(latest);

    if(!state.historyRebuilt){
      state.historyRebuilt=true;
      setStatus('重建历史记录...','warn');
      const added=await rebuildHistoryFromDraws();
      if(added>0)setStatus(`重建历史 ${added} 期`,'ok');
    }

    await drawTrend();

    if(latest.issue===state.lastIssue){setStatus(`无新期(${latest.issue})`,'ok');return;}
    state.lastIssue=latest.issue;
    state.cycleCount++;

    const all=await dbGetAll('draws');
    all.sort((a,b)=>(a.ts||0)-(b.ts||0));
    const seqAll=all.map(d=>d.combo);

    if(state.cycleCount%BACKTEST_EVERY===1&&seqAll.length>=60){
      setStatus('校准 k 值...','warn');
      const bt=backtestBestK(seqAll);
      state.k=bt.k;
      await dbPut('state',{k:'k',value:state.k});
      document.getElementById('kDisplay').textContent='k='+state.k.toFixed(2);
    }

    const recent=seqAll.slice(-WINDOW_SIZE);
    const pred=predict(recent,state.k,true);
    if(!pred){setStatus('分析失败','bad');return;}
    state.currentPred=pred;
    renderPrediction(pred);

    await dbPut('preds',{
      key:latest.issue,issue:latest.issue,
      predict_time:latest.draw_time,
      main:pred.main,defense:pred.defense,
      ranked:pred.ranked,metrics:pred.metrics,k:pred.k,
      actual:null,main_hit:null,def_hit:null,historical:false,
    });

    const fillResult=await backfill(seqAll,draws);
    await refreshHistory();

    if(fillResult&&fillResult.actual){
      let mark,title;
      if(fillResult.main_hit){mark='主推🀄✅';title=`上期命中：${mark}`;}
      else if(fillResult.def_hit){mark='防守🀄✅';title=`上期命中：${mark}`;}
      else{mark='🌸🈳';title=`上期未中：${mark}`;}
      sendNotify(title,`上期 ${fillResult.issue} 开 ${fillResult.actual}`,'result-'+fillResult.issue);
    }
    if(latest.issue!==state.lastNotifiedIssue){
      sendNotify(`新期 ${latest.issue} 预测`,`主攻：${pred.main.join('·')} | 防守：${pred.defense||'无'}`,'pred-'+latest.issue);
      state.lastNotifiedIssue=latest.issue;
    }
    setStatus(`完成(第 ${state.cycleCount} 轮)`,'ok');
  }catch(e){
    console.error(e);setStatus('出错：'+e.message,'bad');
  }
}

async function backfill(seqAll,draws){
  const allPreds=await dbGetAll('preds');
  const predMap={};allPreds.forEach(p=>predMap[p.issue]=p);
  const asc=draws.slice().sort((a,b)=>a.ts-b.ts);
  const nextCombo={},nextIssue={};
  for(let i=0;i<asc.length-1;i++){nextCombo[asc[i].issue]=asc[i+1].combo;nextIssue[asc[i].issue]=asc[i+1].issue;}
  let lastFilled=null;
  for(const[issue,p]of Object.entries(predMap)){
    if(p.actual)continue;
    const actual=nextCombo[issue];if(!actual)continue;
    p.actual=actual;p.main_hit=p.main.includes(actual)?1:0;
    p.def_hit=(p.main_hit===0&&p.defense===actual)?1:0;
    await dbPut('preds',p);
    if(!lastFilled||issue>lastFilled.issue)lastFilled={issue:nextIssue[issue]||issue,actual,main_hit:p.main_hit,def_hit:p.def_hit};
  }
  return lastFilled;
}

/* ================================================================
   对错表 + 形态统计
   ================================================================ */
async function refreshHistory(){
  const preds=await dbGetAll('preds');
  const allDraws=await dbGetAll('draws');

  const ascDraws=allDraws.slice().sort((a,b)=>(a.ts||0)-(b.ts||0));
  const issueToNext={};
  for(let i=0;i<ascDraws.length-1;i++){
    issueToNext[ascDraws[i].issue]=ascDraws[i+1];
  }

  const filled=preds.filter(p=>p.actual)
    .sort((a,b)=>(b.issue||'').localeCompare(a.issue||''))
    .slice(0,HISTORY_REBUILD_COUNT);

  const tbody=document.querySelector('#historyTable tbody');
  tbody.innerHTML='';
  const patternCounts={豹子:0,顺子:0,对子:0,杂六:0};
  let validCount=0;

  for(const p of filled){
    const tr=document.createElement('tr');
    let mark,cls;
    if(p.main_hit){mark='主推🀄✅';cls='hit';}
    else if(p.def_hit){mark='防守🀄✅';cls='hit';}
    else{mark='🌸🈳';cls='miss';}

    const nextDraw=issueToNext[p.issue];
    let issueShow='?',timeShow='',numsShow='?',pattern='-';
    if(nextDraw){
      issueShow=nextDraw.issue;
      const m=(nextDraw.draw_time||'').match(/(\d{2}:\d{2}:\d{2})/);
      timeShow=m?m[1]:'';
      numsShow=`${nextDraw.num_a}+${nextDraw.num_b}+${nextDraw.num_c}=${nextDraw.sum_val}${nextDraw.combo}`;
      pattern=detectPattern(nextDraw.num_a,nextDraw.num_b,nextDraw.num_c);
      patternCounts[pattern]++;
      validCount++;
    }

    tr.innerHTML=`
      <td class="issue-cell">${issueShow}</td>
      <td class="time-cell">${timeShow}</td>
      <td class="nums-cell">${numsShow}</td>
      <td class="pattern-cell"><span class="pattern-tag ${patternClass(pattern)}">${pattern}</span></td>
      <td class="${cls}">${mark}</td>
    `;
    tbody.appendChild(tr);
  }

  const total=filled.length;
  const mainHits=filled.filter(p=>p.main_hit).length;
  const defHits=filled.filter(p=>p.def_hit).length;
  const empty=total-mainHits-defHits;
  document.getElementById('summaryBox').innerHTML=`
    <div><div class="sv">${total}</div><div class="sl">总期数</div></div>
    <div><div class="sv" style="color:#059669">${mainHits}</div><div class="sl">主推命中</div></div>
    <div><div class="sv" style="color:#d97706">${defHits}</div><div class="sl">防守命中</div></div>
    <div><div class="sv" style="color:#dc2626">${empty}</div><div class="sl">全空</div></div>
    <div><div class="sv">${total?(mainHits*100/total).toFixed(1):0}%</div><div class="sl">主推率</div></div>
  `;

  const vc=validCount||1;
  document.getElementById('patternStats').innerHTML=`
    <div class="pattern-stat-item">
      <span class="pattern-tag pt-baozi">豹子</span>
      <span class="pattern-stat-val">${patternCounts.豹子}</span>
      <span class="pattern-stat-lbl" style="color:#6d28d9">${(patternCounts.豹子*100/vc).toFixed(0)}%</span>
    </div>
    <div class="pattern-stat-item">
      <span class="pattern-tag pt-shunzi">顺子</span>
      <span class="pattern-stat-val">${patternCounts.顺子}</span>
      <span class="pattern-stat-lbl" style="color:#0e7490">${(patternCounts.顺子*100/vc).toFixed(0)}%</span>
    </div>
    <div class="pattern-stat-item">
      <span class="pattern-tag pt-duizi">对子</span>
      <span class="pattern-stat-val">${patternCounts.对子}</span>
      <span class="pattern-stat-lbl" style="color:#b45309">${(patternCounts.对子*100/vc).toFixed(0)}%</span>
    </div>
    <div class="pattern-stat-item">
      <span class="pattern-tag pt-zaliu">杂六</span>
      <span class="pattern-stat-val">${patternCounts.杂六}</span>
      <span class="pattern-stat-lbl" style="color:#64748b">${(patternCounts.杂六*100/vc).toFixed(0)}%</span>
    </div>
  `;

  state.lastHistory=filled;
}

/* ================================================================
   UI
   ================================================================ */
function setStatus(msg,type){
  const el=document.getElementById('statusText');
  el.textContent=msg;el.className=type==='ok'?'hit':type==='bad'?'miss':'warn';
}
function setLatest(d){
  document.getElementById('latestIssue').textContent=d.issue;
  const dt=formatDateTime(d.draw_time);
  document.getElementById('latestHeader').innerHTML=
    `<b>第${d.issue}期</b><span class="meta-time">${dt}</span>`;

  document.getElementById('lrA').textContent=d.num_a;
  document.getElementById('lrB').textContent=d.num_b;
  document.getElementById('lrC').textContent=d.num_c;
  document.getElementById('lrSum').textContent=d.sum_val;

  const isBig=d.sum_val>=14;
  const sizeBox=document.getElementById('lrSize');
  sizeBox.textContent=isBig?'大':'小';
  sizeBox.className='size-box '+(isBig?'size-big':'size-small');

  const isOdd=d.sum_val%2===1;
  const parityBox=document.getElementById('lrParity');
  parityBox.textContent=isOdd?'单':'双';
  parityBox.className='size-box '+(isOdd?'parity-odd':'parity-even');
}
function renderPrediction(pred){
  const mainStr=pred.main.join('·');
  const defStr=pred.defense||'无';
  document.getElementById('predLine').innerHTML=
    `<span class="item"><span class="lbl">主攻：</span><span class="main-val">${mainStr}</span></span>`+
    `<span class="item"><span class="lbl">防守：</span><span class="def-val">${defStr}</span></span>`;

  const fixEl=document.getElementById('fixationMsg');
  fixEl.textContent=pred.fixationTriggered?'⚠️ 防固化触发':'';
  fixEl.className=pred.fixationTriggered?'warn':'';

  const tbody=document.querySelector('#metricsTable tbody');
  tbody.innerHTML='';
  pred.ranked.forEach((c,idx)=>{
    const m=pred.metrics[c];
    const tr=document.createElement('tr');
    if(idx<2)tr.style.background='#ecfdf5';
    else if(idx===2)tr.style.background='#fffbeb';
    tr.innerHTML=`<td><b>${c}</b></td>${m.map(v=>`<td class="num">${v.toFixed(1)}</td>`).join('')}<td>[${idx+1}]</td>`;
    tbody.appendChild(tr);
  });
  const boxes=document.getElementById('metricBoxes');
  boxes.innerHTML='';
  const top=pred.main[0];const m=pred.metrics[top];
  const labels=['P1压制','P2遗漏','P3异常','P4转移','P5动量','P6后验','P7对比'];
  m.forEach((v,i)=>{
    const div=document.createElement('div');
    div.className='metric-box';
    div.innerHTML=`<div class="mv">${v.toFixed(0)}</div><div class="ml">${labels[i]}</div>`;
    boxes.appendChild(div);
  });
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.toggle('active',t.id==='tab-'+name));
  if(name==='trend')setTimeout(drawTrend,50);
}

/* ================================================================
   启动
   ================================================================ */
async function boot(){
  await openDB();
  updateNotifyBadge();
  const savedK=await dbGet('state','k');
  if(savedK&&savedK.value){state.k=savedK.value;document.getElementById('kDisplay').textContent='k='+state.k.toFixed(2);}
  updateScratchBtn();
  await refreshHistory();
  await tick();
  startCountdownLoop();
  setInterval(tick,POLL_INTERVAL);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){console.log('页面回到前台，刷新');tick();}
  });
  window.addEventListener('resize',()=>{
    drawTrend();
    if(state.scratchActive){initScratch();}
  });
}
boot();
</script>
